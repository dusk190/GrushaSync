name: Build iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/support-ios
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (Release)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q GrushaSync.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrushaSync-iOS-IPA
          path: GrushaSync.ipa
          retention-days: 14
